name: "CodeQL"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Run weekly on Sundays at midnight
    - cron: "0 0 * * 0"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Use default queries plus security-extended
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # Output to SARIF file instead of uploading to Security tab
          output: codeql-results
          upload: never

      - name: Upload CodeQL results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-results-${{ matrix.language }}
          path: codeql-results
          retention-days: 30

      - name: Display CodeQL summary
        if: always()
        run: |
          echo "## CodeQL Analysis Complete"
          echo "Results have been saved as artifacts."
          echo "Download the 'codeql-results-${{ matrix.language }}' artifact to view detailed findings."
          if [ -d "codeql-results" ]; then
            echo "### Files generated:"
            ls -la codeql-results/
          fi
