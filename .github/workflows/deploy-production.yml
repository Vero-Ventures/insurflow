name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://insurflow.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build for Cloudflare Workers
        run: bun run build:cloudflare
        env:
          # DATABASE_URL needed for build-time validation
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_DATASET: ${{ vars.AXIOM_DATASET }}

      - name: Configure Hyperdrive in wrangler.toml
        run: |
          # Replace the placeholder HYPERDRIVE_ID with actual value
          sed -i 's/\${HYPERDRIVE_ID}/${{ vars.HYPERDRIVE_ID }}/g' wrangler.toml

      - name: Deploy to Cloudflare Workers
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_DATASET: ${{ vars.AXIOM_DATASET }}
        run: |
          npx wrangler deploy \
            --var "BETTER_AUTH_SECRET:$BETTER_AUTH_SECRET" \
            --var "BETTER_AUTH_URL:$BETTER_AUTH_URL" \
            --var "AXIOM_TOKEN:$AXIOM_TOKEN" \
            --var "AXIOM_DATASET:$AXIOM_DATASET"
