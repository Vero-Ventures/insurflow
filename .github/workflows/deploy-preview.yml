name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  WORKER_NAME: insurflow-preview-pr-${{ github.event.pull_request.number }}

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Neon Branch
        id: neon-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          username: neondb_owner

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations on branch
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url_with_pooler }}?sslmode=require

      - name: Build for Cloudflare Workers
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url_with_pooler }}?sslmode=require
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: https://${{ env.WORKER_NAME }}.workers.dev
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_DATASET: ${{ vars.AXIOM_DATASET }}
        run: bun run build:cloudflare

      - name: Deploy Preview Worker
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url_with_pooler }}?sslmode=require
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: https://${{ env.WORKER_NAME }}.workers.dev
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_DATASET: ${{ vars.AXIOM_DATASET }}
        run: |
          npx wrangler deploy \
            --name "${{ env.WORKER_NAME }}" \
            --var "DATABASE_URL:$DATABASE_URL" \
            --var "BETTER_AUTH_SECRET:$BETTER_AUTH_SECRET" \
            --var "BETTER_AUTH_URL:$BETTER_AUTH_URL" \
            --var "AXIOM_TOKEN:$AXIOM_TOKEN" \
            --var "AXIOM_DATASET:$AXIOM_DATASET"

      - name: Comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            const workerUrl = `https://${process.env.WORKER_NAME}.workers.dev`;
            const neonBranchUrl = `https://console.neon.tech/app/projects/${{ vars.NEON_PROJECT_ID }}/branches`;

            const body = `## Preview Deployment Ready

            | Resource | Link |
            |----------|------|
            | Preview URL | [${workerUrl}](${workerUrl}) |
            | Neon Branch | [preview/pr-${{ github.event.pull_request.number }}](${neonBranchUrl}) |

            This preview has its own isolated database branch. Changes here won't affect production data.

            ---
            <sub>Deployed by Cloudflare Workers via GitHub Actions</sub>`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => 
              c.user.type === 'Bot' && 
              c.body.includes('Preview Deployment Ready')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
